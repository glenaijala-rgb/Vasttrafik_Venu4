name: V2 backend tests
on:
  pull_request:
  push:
    branches: [main, v2.2-ak-hem]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check src/server.mjs
      - run: npm test
